services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    ports:
      - "8001:8001"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8001
    depends_on:
      - backend
    command: ["python", "-m", "bot.bot"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - REACT_APP_BACKEND_URL=${PUBLIC_BACKEND_URL}
    ports:
      - "3000:3000"
    depends_on:
      - backend

# NOTE: Supabase/PostgreSQL is expected to be a managed/external service.
# Point DATABASE_URL / SUPABASE_* at it in .env, or add a `postgres` service here
# and run migrations/001_init.sql on first boot.
